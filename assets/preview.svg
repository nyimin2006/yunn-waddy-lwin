<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0e1c"/>
      <stop offset="50%" stop-color="#241324"/>
      <stop offset="100%" stop-color="#140b15"/>
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e8849b" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#d8647e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#140b15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#roseBg)"/>
  <rect width="1200" height="900" fill="url(#roseGlow)"/>

  <!-- Ornate subtle border -->
  <rect x="50" y="50" width="1100" height="800" rx="24" fill="none" stroke="rgba(244, 182, 194, 0.2)" stroke-width="1.5"/>
  <rect x="65" y="65" width="1070" height="770" rx="16" fill="none" stroke="rgba(244, 182, 194, 0.1)" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Elegant Art Frame & Star Motif (Subtle & Classy) -->
  <g transform="translate(600, 360)">
    <!-- Outer delicate diamond -->
    <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="#f4b6c2" stroke-width="1.5" opacity="0.6"/>
    <!-- Inner diamond -->
    <polygon points="0,-48 48,0 0,48 -48,0" fill="none" stroke="#f4b6c2" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
    <!-- Center star -->
    <text x="0" y="8" fill="#f4b6c2" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" text-anchor="middle" opacity="0.85">✦</text>
  </g>

  <!-- Title & Dedication -->
  <text x="600" y="540" fill="#fff5f7" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="44" font-weight="600" letter-spacing="4" text-anchor="middle">
    YUNN WADDY LWIN
  </text>
  <text x="600" y="590" fill="#f4b6c2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" letter-spacing="2" text-anchor="middle">
    PRESENTED BY NYI MIN HTET
  </text>
  <text x="600" y="635" fill="#d4a5b2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="300" letter-spacing="1" text-anchor="middle" opacity="0.75">
    Awaiting your art photo upload
  </text>
</svg>
